<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meetings">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Meeting Planner</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-light: #2F5496;
    --white: #FFFFFF;
    --bg: #FFFFFF;
    --text: #111111;
    --muted: #8A93A6;
    --accent: #1F3864;
    --grey-text: #444444;
    --grey-border: #D8DEE8;
    --grey-bg: #F5F7FA;
    --work-bg: #DFF0DF;
    --work-text: #1E5B2E;
    --shoulder-bg: #FBF0D8;
    --shoulder-text: #7A5B12;
    --night-bg: #EEF0F4;
    --night-text: #8A93A6;
    --sel: #1F3864;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161B;
      --text: #E8EAF0;
      --muted: #98A2B3;
      --accent: #9DB8E8;
      --grey-text: #B8BFCC;
      --grey-border: #2A3140;
      --grey-bg: #1D2230;
      --work-bg: #17321F;
      --work-text: #82D598;
      --shoulder-bg: #34290F;
      --shoulder-text: #E8C36A;
      --night-bg: #1A1E26;
      --night-text: #6B7280;
      --sel: #9DB8E8;
    }
  }
  * { box-sizing: border-box; }
  :root { color-scheme: light dark; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #view-planner {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #view-planner > :not(.gridwrap) { flex-shrink: 0; }
  #view-groups {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }

  header.top {
    background: var(--navy);
    color: var(--white);
    padding: 9px 20px 8px;
    position: sticky; top: 0; z-index: 30;
  }
  header.top h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .datebar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 16px 0;
  }
  .datebar label { font-size: 13px; color: var(--grey-text); font-weight: 600; }
  .datebar input[type="date"] {
    flex: 1;
    padding: 8px 10px;
    border: 1.5px solid var(--grey-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
  }
  .todaybtn {
    border: 1.5px solid var(--grey-border);
    background: var(--grey-bg);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 8px;
    font-family: inherit;
  }

  .grouptag {
    margin: 10px 16px 0;
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .grouptag .glabel { color: var(--muted); font-weight: 600; }
  .grouptag .gedited { color: var(--muted); font-weight: 600; font-style: italic; }
  .grouptag select {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    padding: 0;
    max-width: 60vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .grouptag .gchev { color: var(--muted); font-size: 10px; margin-left: 2px; }

  .addrow { margin: 12px 16px 0; position: relative; }
  .addbtn {
    width: 100%;
    border: 1.5px dashed var(--navy-light);
    background: var(--bg);
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    padding: 11px 0;
    border-radius: 10px;
    font-family: inherit;
  }
  .searchbox {
    border: 1.5px solid var(--navy-light);
    border-radius: 10px;
    background: var(--bg);
    overflow: hidden;
  }
  .searchbox input {
    width: 100%;
    border: none;
    outline: none;
    padding: 12px 12px;
    font-size: 15px;
    font-family: inherit;
    background: transparent;
    color: var(--text);
  }
  .results {
    max-height: 260px;
    overflow-y: auto;
    border-top: 1.5px solid var(--grey-border);
  }
  .results .rgroup {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 12px 4px;
    background: var(--grey-bg);
  }
  .results .ritem {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    border: none;
    background: none;
    text-align: left;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--text);
    border-bottom: 1px solid var(--grey-bg);
  }
  .ritem:active { background: var(--grey-bg); }
  .ritem .rcity { font-weight: 600; }
  .ritem .rmeta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .results .rempty { padding: 14px 12px; font-size: 13.5px; color: var(--muted); }
  .cancelsearch {
    display: block;
    width: 100%;
    border: none;
    border-top: 1.5px solid var(--grey-border);
    background: var(--grey-bg);
    color: var(--grey-text);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 0;
    font-family: inherit;
  }

  .gridwrap {
    flex: 1 1 auto;
    min-height: 0;
    margin: 14px 16px 10px;
    border: 1.5px solid var(--grey-border);
    border-radius: 12px;
    overflow: auto;
    overscroll-behavior: contain;
  }
  .tzgrid { display: grid; }
  .tzgrid.scrollmode { min-width: max-content; }
  .tzgrid .hcell {
    position: sticky; top: 0; z-index: 5;
    background: var(--navy);
    color: var(--white);
    padding: 8px 8px 7px;
    min-width: 0;
    overflow: hidden;
    border-right: 1px solid #33507E;
  }
  .tzgrid.scrollmode .hcell { min-width: 84px; }
  .hcell .hcity {
    display: flex;
    align-items: baseline;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
  }
  .hcell .hname { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hcell .hoff { flex-shrink: 0; font-size: 10.5px; font-weight: 400; color: #C9D4E8; margin-left: 4px; }
  .hcell .hbtns { display: flex; gap: 4px; margin-top: 5px; }
  .hcell .hbtns button {
    border: none;
    background: #33507E;
    color: var(--white);
    font-size: 11px;
    font-weight: 700;
    border-radius: 5px;
    padding: 2px 7px;
    font-family: inherit;
    line-height: 1.4;
  }
  .tzgrid .cell {
    padding: 7px 4px;
    font-size: 13px;
    text-align: center;
    border-right: 1px solid var(--grey-border);
    border-bottom: 1px solid var(--grey-border);
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
  }
  /* shrink tiers so up to 6 columns fit one screen wide */
  .tzgrid.c5 .cell { font-size: 11.5px; padding: 6px 2px; }
  .tzgrid.c6 .cell { font-size: 10.5px; padding: 6px 1px; }
  .tzgrid.c5 .hcell, .tzgrid.c6 .hcell { padding: 7px 5px 6px; }
  .tzgrid.c5 .hcity { font-size: 11px; }
  .tzgrid.c6 .hcity { font-size: 10px; }
  .tzgrid.c5 .hoff, .tzgrid.c6 .hoff { font-size: 9px; }
  .tzgrid.c5 .hbtns button, .tzgrid.c6 .hbtns button { padding: 2px 5px; font-size: 10px; }
  .tzgrid.c5 .hbtns, .tzgrid.c6 .hbtns { gap: 3px; }
  .tzgrid.c5 .dtag { font-size: 8.5px; }
  .tzgrid.c6 .dtag { font-size: 8px; }
  .cell.work { background: var(--work-bg); color: var(--work-text); }
  .cell.shoulder { background: var(--shoulder-bg); color: var(--shoulder-text); }
  .cell.night { background: var(--night-bg); color: var(--night-text); }
  .cell .dtag { font-size: 9.5px; font-weight: 700; margin-left: 3px; opacity: 0.8; }
  .cell.selrow {
    outline: 2px solid var(--sel);
    outline-offset: -2px;
    font-weight: 700;
  }


  .summary {
    margin: 12px 16px 0;
    border: 1.5px solid var(--navy-light);
    border-radius: 12px;
    padding: 12px 14px;
    background: var(--grey-bg);
  }
  .summary .stext { font-size: 13.5px; color: var(--text); line-height: 1.5; }
  .savemsg {
    text-align: center;
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    margin-top: 6px;
    min-height: 17px;
  }

  .empty {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 40px 20px;
  }

  .viewpad { padding: 14px 16px 20px; }
  .viewpad h2 { font-size: 15px; color: var(--accent); margin: 6px 0 12px; }
  .gcard {
    border: 1.5px solid var(--grey-border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .gcard .gname { font-weight: 700; color: var(--accent); font-size: 14.5px; }
  .gcard .gcities { font-size: 12.5px; color: var(--grey-text); margin: 4px 0 8px; }
  .gcard .gbtns { display: flex; gap: 8px; }
  .gcard .gbtns button {
    border: 1.5px solid var(--grey-border);
    background: var(--grey-bg);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 8px;
    font-family: inherit;
  }
  .gcard .gbtns button.gdel { color: #D9534F; }
  .saverow { display: flex; gap: 8px; margin-bottom: 14px; }
  .saverow input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1.5px solid var(--grey-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
  }
  .saverow button {
    flex-shrink: 0;
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13.5px;
    font-weight: 700;
    font-family: inherit;
  }

  nav.bottom {
    flex-shrink: 0;
    display: flex;
    background: var(--bg);
    border-top: 1.5px solid var(--grey-border);
  }
  nav.bottom button {
    flex: 1;
    padding: 12px 0 10px;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
  }
  nav.bottom button.active { color: var(--accent); }
  nav.bottom button .dot {
    display: block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    margin: 0 auto 5px;
    opacity: 0;
  }
  nav.bottom button.active .dot { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Meeting Planner</h1>
  </header>

  <div id="view-planner"></div>
  <div id="view-groups" style="display:none;"></div>

  <nav class="bottom">
    <button id="tab-planner" class="active"><span class="dot"></span>Planner</button>
    <button id="tab-groups"><span class="dot"></span>Groups</button>
  </nav>
</div>

// ---------- Timezone math (Intl-based, DST-correct, no libraries) ----------
const HOUR = 3600 * 1000;
const partsFmtCache = {};
function partsFmt(zone) {
  if (!partsFmtCache[zone]) {
    partsFmtCache[zone] = new Intl.DateTimeFormat('en-US', {
      timeZone: zone, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
  }
  return partsFmtCache[zone];
}
function zoneParts(zone, utcMs) {
  const out = {};
  partsFmt(zone).formatToParts(new Date(utcMs)).forEach(p => { if (p.type !== 'literal') out[p.type] = p.value; });
  return out;
}
function zoneOffsetAt(zone, utcMs) {
  const p = zoneParts(zone, utcMs);
  const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return asUtc - Math.floor(utcMs / 1000) * 1000;
}
// UTC instant of local wall-clock time y-m-d hh:mm in `zone` (two-pass offset correction)
function zonedTimeToUtc(zone, y, m, d, hh, mm) {
  const wall = Date.UTC(y, m - 1, d, hh, mm);
  let guess = wall - zoneOffsetAt(zone, wall);
  guess = wall - zoneOffsetAt(zone, guess);
  return guess;
}
function fmtTime(zone, utcMs) {
  const p = zoneParts(zone, utcMs);
  return `${String(+p.hour % 24).padStart(2,'0')}:${p.minute}`;
}
function localHourFrac(zone, utcMs) {
  const p = zoneParts(zone, utcMs);
  return (+p.hour % 24) + (+p.minute) / 60;
}
function localDateKey(zone, utcMs) {
  const p = zoneParts(zone, utcMs);
  return `${p.year}-${p.month}-${p.day}`;
}
const wdayFmtCache = {};
function weekday(zone, utcMs) {
  if (!wdayFmtCache[zone]) wdayFmtCache[zone] = new Intl.DateTimeFormat('en-GB', { timeZone: zone, weekday: 'short' });
  return wdayFmtCache[zone].format(new Date(utcMs));
}
function offsetLabel(zone, utcMs) {
  const mins = Math.round(zoneOffsetAt(zone, utcMs) / 60000);
  if (mins === 0) return 'UTC+0';
  const sign = mins < 0 ? '−' : '+';
  const a = Math.abs(mins);
  const h = Math.floor(a / 60), m = a % 60;
  return `UTC${sign}${h}${m ? ':' + String(m).padStart(2,'0') : ''}`;
}

// ---------- Search ----------
function norm(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function searchCities(q) {
  const nq = norm(q.trim());
  if (!nq) return null; // caller shows the common + full list
  const hits = CITIES.filter(x =>
    norm(x.c).includes(nq) || norm(x.k).includes(nq) || norm(x.z.replace(/_/g,' ')).includes(nq)
  );
  // fall back to raw IANA zones not covered by the curated list
  const seenZones = new Set(hits.map(h => h.z));
  let ianaHits = [];
  try {
    ianaHits = Intl.supportedValuesOf('timeZone')
      .filter(z => norm(z.replace(/_/g,' ')).includes(nq) && !seenZones.has(z))
      .map(z => ({ c: z.split('/').pop().replace(/_/g,' '), k: z, z }));
  } catch (e) { /* older browsers */ }
  return [...hits, ...ianaHits].slice(0, 60);
}

// ---------- State & persistence ----------
let locations = [];   // [{c, k, z}]
let groups = {};      // {name: [{c, k, z}]}
let dateStr = todayStr();
let selectedRow = null;
let searchOpen = false;
let saveOpen = false;
let activeGroup = null;   // name of the group last loaded/saved, or null
let groupEdited = false;  // locations changed since that group was loaded/saved
let activeTab = 'planner';

function todayStr() { return new Date().toISOString().slice(0, 10); }

function loadState() {
  try {
    const rawL = localStorage.getItem('mp_locations');
    if (rawL) locations = JSON.parse(rawL);
  } catch (e) { locations = []; }
  try {
    const rawG = localStorage.getItem('mp_groups');
    if (rawG) groups = JSON.parse(rawG);
  } catch (e) { groups = {}; }
  if (!Array.isArray(locations)) locations = [];
  if (!groups || typeof groups !== 'object') groups = {};
  try {
    const rawA = localStorage.getItem('mp_active');
    if (rawA) {
      const a = JSON.parse(rawA);
      if (a && a.name && groups[a.name]) { activeGroup = a.name; groupEdited = !!a.edited; }
    }
  } catch (e) { /* ignore */ }
  if (locations.length === 0) {
    // seed with the user's own timezone
    const myZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const match = CITIES.find(x => x.z === myZone);
    locations = [match ? { ...match } : { c: myZone.split('/').pop().replace(/_/g,' '), k: myZone, z: myZone }];
  }
}
function saveLocations() {
  try { localStorage.setItem('mp_locations', JSON.stringify(locations)); }
  catch (e) { console.error('Storage error', e); }
}
function saveGroups() {
  try { localStorage.setItem('mp_groups', JSON.stringify(groups)); }
  catch (e) { console.error('Storage error', e); }
}
function saveActiveGroup() {
  try { localStorage.setItem('mp_active', JSON.stringify({ name: activeGroup, edited: groupEdited })); }
  catch (e) { console.error('Storage error', e); }
}
function setActiveGroup(name) {
  activeGroup = name;
  groupEdited = false;
  saveActiveGroup();
}
function markLocationsChanged() {
  if (activeGroup) { groupEdited = true; saveActiveGroup(); }
  saveOpen = false;
}

// ---------- Planner view ----------
function cellClass(hourFrac) {
  if (hourFrac >= 8 && hourFrac < 18) return 'work';
  if ((hourFrac >= 6 && hourFrac < 8) || (hourFrac >= 18 && hourFrac < 22)) return 'shoulder';
  return 'night';
}

function rowUtcs() {
  const [y, m, d] = dateStr.split('-').map(Number);
  const refZone = locations[0].z;
  const midnight = zonedTimeToUtc(refZone, y, m, d, 0, 0);
  const rows = [];
  for (let i = 0; i < 24; i++) rows.push(midnight + i * HOUR);
  return rows;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function summaryText(utc) {
  const refZone = locations[0].z;
  const refKey = localDateKey(refZone, utc);
  const dateFmt = new Intl.DateTimeFormat('en-GB', { timeZone: refZone, weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const parts = locations.map(loc => {
    const t = fmtTime(loc.z, utc);
    const key = localDateKey(loc.z, utc);
    const tag = key === refKey ? '' : ` (${weekday(loc.z, utc)})`;
    return `${t} ${loc.c}${tag}`;
  });
  return `${dateFmt.format(new Date(utc))} — ${parts.join(' / ')}`;
}

function renderPlanner() {
  const el = document.getElementById('view-planner');
  const oldWrap = el.querySelector('.gridwrap');
  const gridScroll = oldWrap ? { t: oldWrap.scrollTop, l: oldWrap.scrollLeft } : null;
  let html = `
    <div class="datebar">
      <label for="meetDate">Date</label>
      <input type="date" id="meetDate" value="${dateStr}">
      <button class="todaybtn" id="todayBtn">Today</button>
    </div>`;
  const groupNames = Object.keys(groups).sort();
  if (groupNames.length > 0) {
    const opts = groupNames.map(n =>
      `<option value="${esc(n)}"${n === activeGroup ? ' selected' : ''}>${esc(n)}</option>`).join('');
    html += `<div class="grouptag"><span class="glabel">Group:</span> <select id="groupSelect">${activeGroup ? '' : '<option value="" selected>–</option>'}${opts}</select><span class="gchev">▾</span>${groupEdited ? ' <span class="gedited">· edited</span>' : ''}</div>`;
  }
  html += `
    <div class="addrow" id="addrow">`;
  if (searchOpen) {
    html += `
      <div class="searchbox">
        <input type="text" id="citySearch" placeholder="Search city, country or timezone…" autocomplete="off">
        <div class="results" id="cityResults"></div>
        <button class="cancelsearch" id="cancelSearch">Cancel</button>
      </div>`;
  } else if (saveOpen) {
    html += `
      <div class="saverow" style="margin:0;">
        <input type="text" id="plannerGroupName" placeholder="Group name">
        <button id="plannerSaveGroupBtn">Save</button>
        <button id="plannerSaveCancelBtn" style="background:var(--grey-bg);color:var(--grey-text);border:1.5px solid var(--grey-border);">Cancel</button>
      </div>`;
  } else {
    html += `<div style="display:flex;gap:8px;">
      <button class="addbtn" id="addLocBtn" style="flex:1.4;">+ Add location</button>
      ${locations.length > 0 ? `<button class="addbtn" id="saveAsGroupBtn" style="flex:1;border-style:solid;">Save as group</button>` : ''}
    </div>`;
  }
  html += `</div><div class="savemsg" id="plannerGroupMsg" style="min-height:0;"></div>`;

  if (locations.length === 0) {
    html += `<div class="empty">No locations yet.<br>Add one to get started.</div>`;
    el.innerHTML = html;
    wirePlanner(el);
    return;
  }

  const rows = rowUtcs();
  const refZone = locations[0].z;
  const refKey = localDateKey(refZone, rows[0]);
  const noonUtc = rows[12];

  if (selectedRow !== null && selectedRow < rows.length) {
    const text = summaryText(rows[selectedRow]);
    html += `
      <div class="summary">
        <div class="stext" id="summaryText">${esc(text)}</div>
      </div>`;
  }

  const n = locations.length;
  const fits = n <= 6;
  const gridClass = fits ? `tzgrid c${n}` : 'tzgrid scrollmode';
  const colSpec = fits ? `repeat(${n}, minmax(0, 1fr))` : `repeat(${n}, minmax(84px, 1fr))`;
  html += `<div class="gridwrap" style="margin-top:8px;"><div class="${gridClass}" style="grid-template-columns: ${colSpec};">`;
  locations.forEach((loc, li) => {
    const off = offsetLabel(loc.z, noonUtc).replace('UTC', '');
    html += `
      <div class="hcell">
        <div class="hcity" title="${esc(loc.z)}"><span class="hname">${esc(loc.c)}</span><span class="hoff">${off}</span></div>
        <div class="hbtns">
          ${li > 0 ? `<button data-act="ref" data-i="${li}" title="Make reference">⇤</button>` : ''}
          <button data-act="del" data-i="${li}" title="Remove">×</button>
        </div>
      </div>`;
  });
  rows.forEach((utc, ri) => {
    locations.forEach(loc => {
      const hf = localHourFrac(loc.z, utc);
      const cls = cellClass(hf);
      const key = localDateKey(loc.z, utc);
      const dtag = key === refKey ? '' : `<span class="dtag">(${weekday(loc.z, utc).slice(0, 2).toUpperCase()})</span>`;
      const sel = selectedRow === ri ? ' selrow' : '';
      html += `<div class="cell ${cls}${sel}" data-row="${ri}">${fmtTime(loc.z, utc)}${dtag}</div>`;
    });
  });
  html += `</div></div>`;

  el.innerHTML = html;
  const newWrap = el.querySelector('.gridwrap');
  if (newWrap && gridScroll) { newWrap.scrollTop = gridScroll.t; newWrap.scrollLeft = gridScroll.l; }
  wirePlanner(el);
}

function wirePlanner(el) {
  const dateInp = document.getElementById('meetDate');
  if (dateInp) dateInp.oninput = (e) => {
    if (!e.target.value) return;
    dateStr = e.target.value;
    renderPlanner();
  };
  const todayBtn = document.getElementById('todayBtn');
  if (todayBtn) todayBtn.onclick = () => { dateStr = todayStr(); renderPlanner(); };

  const groupSel = document.getElementById('groupSelect');
  if (groupSel) {
    const tmp = document.createElement('span');
    tmp.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:13px;font-weight:700;';
    tmp.textContent = groupSel.selectedOptions[0] ? groupSel.selectedOptions[0].textContent : '';
    document.body.appendChild(tmp);
    groupSel.style.width = Math.min(tmp.offsetWidth + 6, window.innerWidth * 0.6) + 'px';
    tmp.remove();
  }
  if (groupSel) groupSel.onchange = () => {
    const name = groupSel.value;
    if (!name || !groups[name]) return;
    locations = groups[name].map(l => ({ ...l }));
    selectedRow = null;
    setActiveGroup(name);
    saveLocations();
    renderPlanner();
  };

  const addBtn = document.getElementById('addLocBtn');
  if (addBtn) addBtn.onclick = () => {
    searchOpen = true;
    renderPlanner();
    const s = document.getElementById('citySearch');
    if (s) s.focus();
  };

  const cancel = document.getElementById('cancelSearch');
  if (cancel) cancel.onclick = () => { searchOpen = false; renderPlanner(); };

  const search = document.getElementById('citySearch');
  if (search) {
    renderResults('');
    search.oninput = () => renderResults(search.value);
  }

  el.querySelectorAll('.hbtns button').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.i, 10);
      if (btn.dataset.act === 'del') {
        locations.splice(i, 1);
      } else if (btn.dataset.act === 'ref') {
        const [loc] = locations.splice(i, 1);
        locations.unshift(loc);
      }
      selectedRow = null;
      markLocationsChanged();
      saveLocations();
      renderPlanner();
    };
  });

  el.querySelectorAll('.cell').forEach(cell => {
    cell.onclick = () => {
      const ri = parseInt(cell.dataset.row, 10);
      selectedRow = selectedRow === ri ? null : ri;
      renderPlanner();
      const sel = document.querySelector('#view-planner .cell.selrow');
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    };
  });

  const saveAsBtn = document.getElementById('saveAsGroupBtn');
  if (saveAsBtn) saveAsBtn.onclick = () => {
    saveOpen = true;
    renderPlanner();
    const inp = document.getElementById('plannerGroupName');
    if (inp) inp.focus();
  };

  const plannerSaveCancel = document.getElementById('plannerSaveCancelBtn');
  if (plannerSaveCancel) plannerSaveCancel.onclick = () => { saveOpen = false; renderPlanner(); };

  const plannerSaveBtn = document.getElementById('plannerSaveGroupBtn');
  if (plannerSaveBtn) plannerSaveBtn.onclick = () => {
    const inp = document.getElementById('plannerGroupName');
    const msg = document.getElementById('plannerGroupMsg');
    const name = inp.value.trim();
    if (!name) { msg.textContent = 'Give the group a name first.'; return; }
    groups[name] = locations.map(l => ({ ...l }));
    saveGroups();
    setActiveGroup(name);
    saveOpen = false;
    renderPlanner();
    const m = document.getElementById('plannerGroupMsg');
    if (m) m.textContent = `Saved "${name}" (${locations.length} location${locations.length === 1 ? '' : 's'}).`;
    setTimeout(() => { const m2 = document.getElementById('plannerGroupMsg'); if (m2) m2.textContent = ''; }, 3000);
  };

}

function renderResults(q) {
  const box = document.getElementById('cityResults');
  if (!box) return;
  const inList = new Set(locations.map(l => l.z + '|' + l.c));
  let html = '';
  const results = searchCities(q);
  if (results === null) {
    const common = COMMON.map(name => CITIES.find(x => x.c === name)).filter(Boolean);
    html += `<div class="rgroup">Common</div>`;
    html += common.map(itemHtml).join('');
    html += `<div class="rgroup">All cities</div>`;
    html += CITIES.map(itemHtml).join('');
  } else if (results.length === 0) {
    html = `<div class="rempty">No matches. Try a big city nearby, or an IANA zone name like "Asia/Kolkata".</div>`;
  } else {
    html = results.map(itemHtml).join('');
  }
  box.innerHTML = html;

  function itemHtml(x) {
    const added = inList.has(x.z + '|' + x.c);
    return `<button class="ritem" data-z="${esc(x.z)}" data-c="${esc(x.c)}" data-k="${esc(x.k)}" ${added ? 'style="opacity:0.45;"' : ''}>
      <span class="rcity">${esc(x.c)}${added ? ' ✓' : ''}</span>
      <span class="rmeta">${esc(x.k)} · ${esc(x.z)}</span>
    </button>`;
  }

  box.querySelectorAll('.ritem').forEach(btn => {
    btn.onclick = () => {
      locations.push({ c: btn.dataset.c, k: btn.dataset.k, z: btn.dataset.z });
      searchOpen = false;
      selectedRow = null;
      markLocationsChanged();
      saveLocations();
      renderPlanner();
    };
  });
}

// ---------- Groups view ----------
function renderGroups() {
  const el = document.getElementById('view-groups');
  let html = `<div class="viewpad"><h2>Saved groups</h2>
    <div class="saverow">
      <input type="text" id="groupName" placeholder="Group name">
      <button id="saveGroupBtn">Save</button>
    </div>
    <div class="savemsg" id="groupMsg"></div>`;
  const names = Object.keys(groups).sort();
  if (names.length === 0) {
    html += `<div class="empty">No saved groups yet.<br>Set up locations in the Planner, then save them here under a name.</div>`;
  } else {
    names.forEach(name => {
      const cities = groups[name].map(l => l.c).join(', ');
      html += `
        <div class="gcard">
          <div class="gname">${esc(name)}</div>
          <div class="gcities">${esc(cities)}</div>
          <div class="gbtns">
            <button data-act="load" data-name="${esc(name)}">Load</button>
            <button class="gdel" data-act="del" data-name="${esc(name)}">Delete</button>
          </div>
        </div>`;
    });
  }
  html += `</div>`;
  el.innerHTML = html;

  document.getElementById('saveGroupBtn').onclick = () => {
    const inp = document.getElementById('groupName');
    const msg = document.getElementById('groupMsg');
    const name = inp.value.trim();
    if (!name) { msg.textContent = 'Give the group a name first.'; return; }
    if (locations.length === 0) { msg.textContent = 'Add some locations in the Planner first.'; return; }
    groups[name] = locations.map(l => ({ ...l }));
    saveGroups();
    setActiveGroup(name);
    renderGroups();
    document.getElementById('groupMsg').textContent = `Saved "${name}" (${locations.length} locations).`;
  };

  el.querySelectorAll('.gcard button').forEach(btn => {
    btn.onclick = () => {
      const name = btn.dataset.name;
      if (btn.dataset.act === 'load') {
        locations = groups[name].map(l => ({ ...l }));
        selectedRow = null;
        setActiveGroup(name);
        saveLocations();
        showTab('planner');
      } else {
        if (!confirm(`Delete group "${name}"?`)) return;
        delete groups[name];
        saveGroups();
        if (activeGroup === name) { activeGroup = null; groupEdited = false; saveActiveGroup(); }
        renderGroups();
      }
    };
  });
}

// ---------- Tabs & init ----------
function showTab(tab) {
  activeTab = tab;
  document.getElementById('view-planner').style.display = tab === 'planner' ? '' : 'none';
  document.getElementById('view-groups').style.display = tab === 'groups' ? '' : 'none';
  document.getElementById('tab-planner').classList.toggle('active', tab === 'planner');
  document.getElementById('tab-groups').classList.toggle('active', tab === 'groups');
  if (tab === 'planner') renderPlanner();
  if (tab === 'groups') renderGroups();
}
document.getElementById('tab-planner').onclick = () => showTab('planner');
document.getElementById('tab-groups').onclick = () => showTab('groups');

loadState();
showTab('planner');
</script>
